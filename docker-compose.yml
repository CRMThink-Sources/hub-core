services:
  api:
    image: ghcr.io/crmthink-sources/hub-core-api:latest
    container_name: hubthink-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    networks:
      - hubthink

  front:
    image: ghcr.io/crmthink-sources/hub-core-front:latest
    container_name: hubthink-front
    restart: unless-stopped
    env_file:
      - ./front/.env
    networks:
      - hubthink

  mcp:
    image: ghcr.io/crmthink-sources/hub-core-mcp:latest
    container_name: hubthink-mcp
    restart: unless-stopped
    env_file:
      - ./mcp/.env
    networks:
      - hubthink

networks:
  hubthink:
    driver: bridge
