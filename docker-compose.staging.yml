# Override para ambiente staging (usado com: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d)
services:
  api:
    image: ghcr.io/crmthink-sources/hub-core-api:staging
    container_name: hubthink-api-staging
    ports:
      - "4001:4001"
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: ghcr.io/crmthink-sources/hub-core-api:staging
    container_name: hubthink-worker-staging
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/src/workers/thinkzap-inbound.worker.js"]

  worker-clicksign:
    image: ghcr.io/crmthink-sources/hub-core-api:staging
    container_name: hubthink-worker-clicksign-staging
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/src/modules/clicksign/infra/worker/clicksign.worker.js"]

  front:
    image: ghcr.io/crmthink-sources/hub-core-front:staging
    container_name: hubthink-front-staging
    ports:
      - "3001:3000"
    env_file:
      - ./front/.env

  # PORT dentro do container fica sempre 3200; host expõe 3201 no staging
  mcp:
    image: ghcr.io/crmthink-sources/hub-core-mcp:staging
    container_name: hubthink-mcp-staging
    ports:
      - "3201:3200"
    env_file:
      - ./mcp/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
