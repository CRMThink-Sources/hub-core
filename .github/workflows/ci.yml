name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  ci-api:
    name: API - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # prisma.config.ts exige URL ou host/user/database; generate não conecta ao banco.
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: api/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn check-types

      - run: yarn build

  ci-front:
    name: Front - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: front/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn build
