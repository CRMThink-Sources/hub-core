name: CI / CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/crmthink-sources/hub-core-api
  FRONT_IMAGE: ghcr.io/crmthink-sources/hub-core-front
  MCP_IMAGE: ghcr.io/crmthink-sources/hub-core-mcp

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────── CI ───────────────
  ci-api:
    name: API - Lint & Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: api/yarn.lock

      - run: yarn install --frozen-lockfile

      # Sem `yarn build`: o `docker build` do job build-api compila a partir do
      # zero de qualquer jeito, e `check-types` acima já roda o mesmo `tsc`.
      # Buildar aqui era um build inteiro jogado fora por push.
      - run: yarn lint

      - run: yarn check-types

  ci-front:
    name: Front - Lint & Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: front/yarn.lock

      - run: yarn install --frozen-lockfile

      # `check-types` no lugar de `yarn build`: o `next build` do job build-front
      # recompila do zero, e o que este job precisa é do sinal de tipo, que o
      # `tsc --noEmit` dá em uma fração do tempo.
      - run: yarn lint

      - run: yarn check-types

  ci-mcp:
    name: MCP - Lint & Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: mcp/yarn.lock

      - run: yarn install --frozen-lockfile

      # Mesmo motivo do ci-api: o build-mcp recompila no docker.
      - run: yarn lint

      - run: yarn check-types

  # ─────────────── Build & Push Docker Images ───────────────
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: [ci-api]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
          # Cache no registry, e não no cache do Actions: `mode=max` exporta toda
          # camada intermediária — o `node_modules` do builder passa de 500MB — e o
          # cache do Actions tem teto de 10GB, então ele evicta e devolve miss sem
          # avisar. O ghcr é o mesmo destino da imagem, com a banda do próprio push.
          #
          # A tag do cache acompanha a da imagem (`buildcache-latest` /
          # `buildcache-staging`): uma só faria master e develop se derrubarem a cada
          # push alternado.
          cache-from: type=registry,ref=${{ env.API_IMAGE }}:buildcache-${{ steps.tag.outputs.tag }}
          cache-to: type=registry,ref=${{ env.API_IMAGE }}:buildcache-${{ steps.tag.outputs.tag }},mode=max
          # Sem atestação de proveniência: ela acrescenta manifesto e push a cada
          # build. Religar é trocar para `true` se a imagem passar a exigir assinatura.
          provenance: false

  build-front:
    name: Build Front Image
    runs-on: ubuntu-latest
    needs: [ci-front]
    if: github.event_name == 'push'

    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Write front .env for build
        run: |
          cat > ./front/.env << 'ENVEOF'
          ${{ secrets.ENV_FRONT }}
          ENVEOF

      - uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: ${{ env.FRONT_IMAGE }}:${{ steps.tag.outputs.tag }}
          # Ver a justificativa no build-api.
          cache-from: type=registry,ref=${{ env.FRONT_IMAGE }}:buildcache-${{ steps.tag.outputs.tag }}
          cache-to: type=registry,ref=${{ env.FRONT_IMAGE }}:buildcache-${{ steps.tag.outputs.tag }},mode=max
          provenance: false

  build-mcp:
    name: Build MCP Image
    runs-on: ubuntu-latest
    needs: [ci-mcp]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ./mcp
          push: true
          tags: ${{ env.MCP_IMAGE }}:${{ steps.tag.outputs.tag }}
          # Ver a justificativa no build-api.
          cache-from: type=registry,ref=${{ env.MCP_IMAGE }}:buildcache-${{ steps.tag.outputs.tag }}
          cache-to: type=registry,ref=${{ env.MCP_IMAGE }}:buildcache-${{ steps.tag.outputs.tag }},mode=max
          provenance: false

  # ─────────────── Deploy to VPS ───────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-api, build-front, build-mcp]
    if: github.event_name == 'push'

    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v5

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          source: 'docker-compose.yml,docker-compose.staging.yml,docker-compose.production.yml'
          target: ${{ github.ref_name == 'master' && '~/hubthink-production' || '~/hubthink-staging' }}

      # Stack compartilhado na VPS (Grafana/Loki/Promtail) — um diretório dedicado para todo o servidor
      - name: Copy observability stack to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          source: 'docker-compose.observability.yml,observability/'
          target: '~/hubthink-observability'

      - name: Write env files on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          script: |
            if [ "${{ github.ref_name }}" = "master" ]; then
              DEPLOY_DIR=~/hubthink-production
            else
              DEPLOY_DIR=~/hubthink-staging
            fi

            mkdir -p "$DEPLOY_DIR/api" "$DEPLOY_DIR/front" "$DEPLOY_DIR/mcp"
            cat > "$DEPLOY_DIR/api/.env" << 'ENVEOF'
            ${{ secrets.ENV_API }}
            ENVEOF
            cat > "$DEPLOY_DIR/front/.env" << 'ENVEOF'
            ${{ secrets.ENV_FRONT }}
            ENVEOF
            cat > "$DEPLOY_DIR/mcp/.env" << 'ENVEOF'
            ${{ secrets.ENV_MCP }}
            ENVEOF

      - name: Run database migrations
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          envs: GH_TOKEN
          script: |
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            if [ "${{ github.ref_name }}" = "master" ]; then
              IMAGE=ghcr.io/crmthink-sources/hub-core-api:latest
              DEPLOY_DIR=~/hubthink-production
            else
              IMAGE=ghcr.io/crmthink-sources/hub-core-api:staging
              DEPLOY_DIR=~/hubthink-staging
            fi

            docker pull $IMAGE

            docker run --rm \
              --network host \
              --env-file "$DEPLOY_DIR/api/.env" \
              $IMAGE \
              npx prisma migrate deploy

      - name: Login to GHCR on VPS & deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          envs: GH_TOKEN
          script: |
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            if [ "${{ github.ref_name }}" = "master" ]; then
              DEPLOY_DIR=~/hubthink-production
              COMPOSE_PROJECT=hubthink-production
              cd "$DEPLOY_DIR"
              docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.production.yml pull
              docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.production.yml up -d --remove-orphans
            else
              DEPLOY_DIR=~/hubthink-staging
              COMPOSE_PROJECT=hubthink-staging
              cd "$DEPLOY_DIR"
              docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.staging.yml pull
              docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
            fi

            docker image prune -f

      - name: Deploy observability stack (Grafana/Loki/Promtail)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          script: |
            mkdir -p ~/hubthink-observability
            cd ~/hubthink-observability
            echo "=== Observability files on VPS (dashboards must exist here) ==="
            ls -la observability/grafana/provisioning/dashboards/json/ || echo "MISSING: observability/grafana/provisioning/dashboards/json — check SCP and repo"
            docker compose -p hubthink-observability -f docker-compose.observability.yml pull || true
            docker compose -p hubthink-observability -f docker-compose.observability.yml up -d --remove-orphans
            # Grafana aplica provisioning de dashboards sobretudo no start; sem recreate pode não aparecer dash novo
            docker compose -p hubthink-observability -f docker-compose.observability.yml up -d --force-recreate grafana promtail
            docker compose -p hubthink-observability -f docker-compose.observability.yml ps
            echo "=== Grafana provisioning (erros aparecem abaixo) ==="
            docker logs hubthink-grafana 2>&1 | tail -n 80
