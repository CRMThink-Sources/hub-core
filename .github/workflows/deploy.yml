name: Deploy

on:
  push:
    branches: [master, develop]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/crmthink-sources/hub-core-api
  FRONT_IMAGE: ghcr.io/crmthink-sources/hub-core-front

permissions:
  contents: read
  packages: write

jobs:
  # --------------- Build & Push API ---------------
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------- Build & Push Front ---------------
  build-front:
    name: Build Front Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: ${{ env.FRONT_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------- Deploy to VPS ---------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-api, build-front]

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.yml,docker-compose.staging.yml'
          target: ~/hubthink

      - name: Write env files on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ~/hubthink/api ~/hubthink/front
            cat > ~/hubthink/api/.env << 'ENVEOF'
            ${{ secrets.ENV_API }}
            ENVEOF
            cat > ~/hubthink/front/.env << 'ENVEOF'
            ${{ secrets.ENV_FRONT }}
            ENVEOF

      - name: Login to GHCR on VPS & deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/hubthink

            if [ "${{ github.ref_name }}" = "main" ]; then
              docker compose pull
              docker compose up -d --remove-orphans
            else
              docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
              docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
            fi

            docker image prune -f
