services:
  api:
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: ghcr.io/crmthink-sources/hub-core-api:latest
    container_name: hubthink-worker
    restart: unless-stopped
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/src/workers/thinkzap-inbound.worker.js"]

  # Outbound do widget: entrega da mensagem que o operador manda pelo CRM, e a
  # abertura da conversa no canal aberto.
  #
  # Nasceu dentro do processo de inbound, quando a fila só carregava a abertura de
  # conversa — efeito colateral idempotente, cuja falha ninguém sente na hora. Saiu de
  # lá quando passou a carregar a **entrega ao contato**, com o operador já tendo
  # recebido `202`: a partir daí um envio lento segura slot de mensagem recebida, e
  # reiniciar um fluxo derruba o outro. É o mesmo argumento do worker de
  # provisionamento logo abaixo.
  #
  # O nome do container **precisa** começar com `hubthink-worker`: é o que o Promtail
  # casa (`observability/promtail-config.yml`) para coletar os logs. Fora dessa
  # convenção, o log do processo que entrega mensagem some da coleta em silêncio.
  worker-widget-outbound:
    image: ghcr.io/crmthink-sources/hub-core-api:latest
    container_name: hubthink-worker-widget-outbound
    restart: unless-stopped
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/src/workers/thinkzap-widget-outbound.worker.js"]

  # Processo próprio, e não junto do worker de inbound: cada job fala com o provider
  # de WhatsApp e com o gateway de pagamento, e o inbound é o caminho quente de
  # entrega de mensagem — provisionamento não pode dividir processo com ele.
  worker-spa-provisioning:
    image: ghcr.io/crmthink-sources/hub-core-api:latest
    container_name: hubthink-worker-spa-provisioning
    restart: unless-stopped
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/src/workers/spa-item-provisioning.worker.js"]

  # Reconciliação entre o item da SPA 1146 e o recurso remoto dele: limpeza do item
  # apagado e sincronização de status. Processo próprio pela mesma razão do de
  # provisionamento, e separado dele porque o volume é outro — toda edição de campo do
  # item gera um evento aqui.
  worker-spa-resource-sync:
    image: ghcr.io/crmthink-sources/hub-core-api:latest
    container_name: hubthink-worker-spa-resource-sync
    restart: unless-stopped
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/src/workers/spa-item-resource-sync.worker.js"]

  worker-importsheet:
    image: ghcr.io/crmthink-sources/hub-core-api:latest
    container_name: hubthink-worker-importsheet
    restart: unless-stopped
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/src/modules/importsheet/worker/importsheet.worker.js"]

  worker-clicksign:
    image: ghcr.io/crmthink-sources/hub-core-api:latest
    container_name: hubthink-worker-clicksign
    restart: unless-stopped
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/src/modules/clicksign/infra/worker/clicksign.worker.js"]

  # Host 3002 evita conflito com outro app na 3000 (ex.: PM2). Dentro do container o Next segue na 3000.
  front:
    ports:
      - "3002:3000"
